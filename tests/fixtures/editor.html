<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Track Editor regression harness</title>
  <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css" />
  <style>
    html, body, #map { margin: 0; height: 100%; }
  </style>
  <script type="importmap">
    { "imports": { "leaflet": "/node_modules/leaflet/dist/leaflet.js" } }
  </script>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import { createDefaultTiliaApp } from "../../src/index.js";

    // Real Editor and production dependencies own all UI and editing behavior.
    createDefaultTiliaApp("map", {
      plugins: [
        "tilia-gpx-input", "tilia-gpx-renderer", "tilia-gpx-ui",
        "tilia-map-selection-presenter", "tilia-panel", "tilia-layers",
        "tilia-file-import", "tilia-dropzone", "x-track-editor",
      ],
    });
  </script>
</body>
</html>
