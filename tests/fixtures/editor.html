<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Track Editor regression harness</title>
  <link rel="stylesheet" href="../../src/map/vendor/leaflet/2.0.0-beta.1/leaflet.css" />
  <style>
    html, body, #map { margin: 0; height: 100%; }
  </style>
  <script type="importmap">
    { "imports": { "leaflet": "../../src/map/vendor/leaflet/2.0.0-beta.1/leaflet.js" } }
  </script>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import { Canvas } from "leaflet";
    import { createDefaultTiliaApp } from "../../src/index.js";

    const params = new URLSearchParams(location.search);
    // Real Editor and production dependencies own all UI and editing behavior.
    const app = createDefaultTiliaApp("map", {
      baseMapOptions: { mapOptions: { renderer: params.get("renderer") === "canvas" ? new Canvas() : undefined } },
      plugins: [
        "tilia-gpx-input", "tilia-gpx-renderer", "tilia-gpx-ui",
        "tilia-map-selection-presenter", "tilia-panel", "tilia-layers",
        "tilia-file-import", "tilia-dropzone", "x-track-editor",
      ],
    });
    await app.ready;
    const map = app.getMap();
    let restoreFailure = () => {};
    window.editorHarness = {
      app,
      map,
      failNextHandlesPane() {
        restoreFailure();
        const original = map.createPane;
        const owned = Object.hasOwn(map, "createPane");
        restoreFailure = () => {
          if (owned) map.createPane = original;
          else delete map.createPane;
          restoreFailure = () => {};
        };
        map.createPane = function(name, ...args) {
          if (name.includes("editor-handles")) {
            restoreFailure(); // One-shot failure; restore before throwing.
            throw Error("injected handles pane failure");
          }
          return original.call(this, name, ...args);
        };
      },
      async destroy() { restoreFailure(); await app.destroy(); },
    };
  </script>
</body>
</html>
